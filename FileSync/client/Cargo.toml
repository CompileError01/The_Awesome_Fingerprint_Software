[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
# TLS: must match the servers versions since they share the handshake.
# "dangerous_configuration" unlocks writing a custom certificate verifier - it's what
# lets us pin to one exact certificate instead of using a certificate authority.
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
