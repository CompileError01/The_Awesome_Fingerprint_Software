[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
# TLS: encrypts the connection. rcgen creates the self-signed certificate on first run.
tokio-rustls = "0.24"
rustls = "0.21"
rcgen = "0.11"
