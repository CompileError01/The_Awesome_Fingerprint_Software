[package]
name = "web_interface"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = {version = "0.23.0", features = ["csr"] }

chrono = "0.4.26"
#polars = { version = "0.30.0", features = ["lazy"] }
reqwest = { version = "0.11.18", features = ["blocking", "json"] }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.97"
tempfile = "3.6.0"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["Window", "Document", "HtmlDocument", "HtmlInputElement", "RequestCredentials", "HtmlSelectElement"] }
argon2 = "0.5.3"
gloo = "0.12.0"
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
gloo-net = "0.7.0"
